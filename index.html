<html>

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="chrome=1">
    <title>Contador de Dinheiros</title>

    <script src="assets/js/jquery.js"></script>
    <script src="assets/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/jquery.btnswitch.min.js"></script>
    <script src="assets/js/sweetalert2.min.js"></script>

    <link rel="stylesheet" href="assets/css/bootstrap/bootstrap.min.css">
    <link rel="stylesheet" href="assets/css/libs/jquery.btnswitch.min.css">
    <link rel="stylesheet" href="assets/css/libs/sweetalert2.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>



    <div class="div_config">

        <div class="btn_config">
            <svg class="btn_config_icon" xmlns="http://www.w3.org/2000/svg" x="0px" y="0px" width="100" height="100"
                viewBox="0 0 24 24">
                <path fill="currentColor"
                    d="M 9.6679688 2 L 9.1757812 4.5234375 C 8.3550224 4.8338012 7.5961042 5.2674041 6.9296875 5.8144531 L 4.5058594 4.9785156 L 2.1738281 9.0214844 L 4.1132812 10.707031 C 4.0445153 11.128986 4 11.558619 4 12 C 4 12.441381 4.0445153 12.871014 4.1132812 13.292969 L 2.1738281 14.978516 L 4.5058594 19.021484 L 6.9296875 18.185547 C 7.5961042 18.732596 8.3550224 19.166199 9.1757812 19.476562 L 9.6679688 22 L 14.332031 22 L 14.824219 19.476562 C 15.644978 19.166199 16.403896 18.732596 17.070312 18.185547 L 19.494141 19.021484 L 21.826172 14.978516 L 19.886719 13.292969 C 19.955485 12.871014 20 12.441381 20 12 C 20 11.558619 19.955485 11.128986 19.886719 10.707031 L 21.826172 9.0214844 L 19.494141 4.9785156 L 17.070312 5.8144531 C 16.403896 5.2674041 15.644978 4.8338012 14.824219 4.5234375 L 14.332031 2 L 9.6679688 2 z M 12 8 C 14.209 8 16 9.791 16 12 C 16 14.209 14.209 16 12 16 C 9.791 16 8 14.209 8 12 C 8 9.791 9.791 8 12 8 z">
                </path>
            </svg>
        </div>

        <div class="config_fields col-10" hidden>
            <div class="row g-4">
                <div class="col-12">
                    <div class="row">
                        <div class="col-7">
                            <label for="inicial_date">Data Inicial:</label>
                            <input type="date" class="form-control" id="inicial_date">
                        </div>
                        <div class="col-5">
                            <label for="inicial_time">Hora Inicial:</label>
                            <input type="time" class="form-control" id="inicial_time">
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-7">
                            <label for="final_date">Data Final:</label>
                            <input type="date" class="form-control" id="final_date">
                        </div>
                        <div class="col-5">
                            <label for="final_time">Hora Final:</label>
                            <input type="time" class="form-control" id="final_time">
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-7">
                            <label for="base_money">Valor Base:</label>
                            <input type="number" class="form-control" id="base_money" value="120.00">
                        </div>
                        <div class="col-5 d-flex align-items-end justify-content-center">
                            <input type="button" class="btn" id="btn_save_config" value="Salvar">
                        </div>
                    </div>

                </div>

            </div>
        </div>

    </div>



    <div class="row">
        <div class="col-12">
            <div class="div_emote">
                <img src="" alt="image" class="image" id="image">
            </div>
        </div>
    </div>

    <div class="row">
        <div class="col-12">
            <div class="clock">
                <svg class="clock-ring" viewBox="0 0 120 120" aria-hidden="true">
                    <circle class="clock-ring-track" cx="60" cy="60" r="54"></circle>
                    <circle class="clock-ring-progress" cx="60" cy="60" r="54"></circle>
                </svg>
                <div class="time" id="time"></div>
            </div>
        </div>
    </div>

    <div class="row">
        <div class="col-12">
            <div class="money_conter">
                <div class="div_partial_money">

                </div>

                <div class="line"></div>
                <div class="total_money">
                    R$ 0,00
                </div>
            </div>
        </div>
    </div>

</body>

</html>
